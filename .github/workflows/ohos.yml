name: HarmonyOS adaptation
on:
  push:
    branches: [ohos]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable release source commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ohos-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' }}
jobs:
  quality:
    if: github.ref == 'refs/heads/ohos' || inputs.ref != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: python3 -m unittest discover -s tool/ohos -p 'test_*.py'
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=1
  build:
    # Both jobs must succeed. Build in parallel with standard-Flutter regression
    # so a first-time SDK/plugin download does not serialize the entire run.
    if: github.ref == 'refs/heads/ohos' || inputs.ref != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install CPF-Flutter
        run: |
          git clone -b oh-3.47.7-dev https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter-ohos"
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter-ohos/bin/flutter" config --no-analytics
      - name: Install HarmonyOS SDK 26
        uses: ErBWs/setup-ohos@5c8e74d05fc9888a387b6154ba06d0cd9ede3da1 # v1
        with:
          version: '26.0.0.821'
          cache: true
      - name: Verify licensed model and SDK inputs
        run: python3 tool/release/prepare_assets.py
      - name: Prepare isolated HarmonyOS dependencies
        run: python3 tool/ohos/prepare.py
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: Build and verify unsigned HAP
        run: python3 tool/ohos/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: tsukuyomi-space-ohos-unsigned
          path: dist/ohos/*
          if-no-files-found: error
          retention-days: 14
