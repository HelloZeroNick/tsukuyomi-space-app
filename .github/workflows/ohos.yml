name: Build HarmonyOS (ohos)
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ohos-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_OHOS_VERSION: '3.44.9'
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter for OpenHarmony
        run: |
          git clone --depth 1 -b oh-3.44.9-dev https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter"
          # A shallow clone makes `git describe` return 0.0.0-unknown, which
          # breaks pub's Flutter SDK constraint checks; unshallow the tags so
          # git describe resolves to 3.44.9+ohos-...
          git -C "$RUNNER_TEMP/flutter" fetch --tags --depth 10000
          git -C "$RUNNER_TEMP/flutter" describe --tags
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter doctor
      - name: Install DevEco command line tools and HarmonyOS SDK
        run: |
          echo "Download and install command-line tools + HarmonyOS SDK (API 12+)"
          echo "Set DEVECO_SDK_HOME and HarmonyOS command-line tools on PATH here."
          echo "Example tooling: https://developer.huawei.com/consumer/cn/download/"
      - run: flutter pub get
      - name: Build HAP
        run: |
          flutter build hap --debug --target-platform ohos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: tsukuyomi-space-ohos-hap
          path: build/app/outputs/fusion/*/*.hap
          if-no-files-found: error
          retention-days: 14
