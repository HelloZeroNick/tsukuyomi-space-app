name: tsukuyomi_live2d
description: Cubism Native GPU textures and Flutter Canvas fallback.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  code_assets: ^1.1.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TsukuyomiLive2dPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: TsukuyomiLive2dPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: TsukuyomiLive2dPluginCApi
      linux:
        pluginClass: TsukuyomiLive2dPlugin
